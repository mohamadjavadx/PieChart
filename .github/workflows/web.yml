name: Web

# Checks the web version (the web/ folder) on every change to it: types, tests, the build, and what would be published.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 22.18 or newer runs the TypeScript sources of the tests as they are.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Types (the sources and the tests, strict)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build, and check what would be published
        run: npm run build && node tools/check-package.ts
